 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prince Saini Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

/* 🔥 BACKGROUND FIXED */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: white;

  background: linear-gradient(-45deg, #020617, #1e3a8a, #0ea5e9, #ff0000);
  background-size: 400% 400%;
  animation: bg 6s ease infinite;
}

@keyframes bg {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 40px;
  align-items: center;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  color: #38bdf8;
  text-shadow: 0 0 15px #38bdf8;
}

/* HERO */
.hero {
  height: 90vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero span {
  color: #38bdf8;
}

/* SECTIONS */
.section {
  padding: 60px 20px;
  text-align: center;
}

/* CARDS */
.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 10px;
  backdrop-filter: blur(10px);
  width: 200px;
}

/* SKILLS */
.skill {
  width: 300px;
  margin: 10px auto;
}

.bar {
  background: #222;
  border-radius: 10px;
}

.bar span {
  display: block;
  height: 10px;
  background: #38bdf8;
}

/* WHATSAPP */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
  font-size: 20px;
  color: white;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <h1 class="logo">⚡ Prince.dev</h1>
  <div>
    <a href="#home" style="color:white;margin:10px;">Home</a>
    <a href="#services" style="color:white;margin:10px;">Services</a>
    <a href="#skills" style="color:white;margin:10px;">Skills</a>
  </div>
</nav>

<!-- HERO -->
<section id="home" class="hero">
  <h1>I’m <span>Prince Saini</span></h1>
  <p>BCA Student | DevOps Learner</p>
</section>

<!-- SERVICES -->
<section id="services" class="section">
  <h2>Services 💼</h2>

  <div class="container">
    <div class="card">📄 Data Entry</div>
    <div class="card">⌨️ Typing Work</div>
    <div class="card">📊 Data Management</div>
    <div class="card">💻 Web Design</div>
  </div>
</section>

<!-- SKILLS -->
<section id="skills" class="section">
  <h2>Skills ⚡</h2>

  <div class="skill">
    <p>HTML</p>
    <div class="bar"><span style="width:90%"></span></div>
  </div>

  <div class="skill">
    <p>CSS</p>
    <div class="bar"><span style="width:80%"></span></div>
  </div>

  <div class="skill">
    <p>Git & GitHub</p>
    <div class="bar"><span style="width:75%"></span></div>
  </div>
</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/91XXXXXXXXXX">💬</a>

</body>
</html>
