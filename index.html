 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prince Saini | DevOps Portfolio</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      cursor: none; /* Hide default cursor */
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 15px;
      height: 15px;
      background: #38bdf8;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 15px 40px;
      background: #111;
      color: white;
    }

    nav ul {
      display: flex;
      list-style: none;
    }

    nav li {
      margin: 0 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3a8a, #0ea5e9);
      color: white;
      text-align: center;
    }

    .section {
      padding: 50px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="cursor"></div>

<!-- Navbar -->
<nav>
  <h2>⚡ Prince.dev</h2>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<!-- Hero -->
<section class="hero">
  <div>
    <h1>I’m Prince Saini</h1>
    <p>DevOps Learner 🚀</p>
  </div>
</section>

<!-- Section -->
<section class="section">
  <h2>My Projects</h2>
  <p>Coming Soon...</p>
</section>

<script>
  const cursor = document.querySelector(".cursor");

  document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
  });
</script>

</body>
</html>
